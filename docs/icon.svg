<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#022c22" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="420" cy="92" r="140" fill="#fff" opacity=".08"/>
  <!-- inverter body -->
  <g filter="url(#sh)">
    <rect x="136" y="88" width="240" height="320" rx="40" fill="url(#body)"/>
  </g>
  <!-- screen -->
  <rect x="166" y="122" width="180" height="120" rx="20" fill="#0b1220"/>
  <path d="M268 140 L222 194 h30 l-16 40 l48 -58 h-30 z" fill="url(#bolt)"/>
  <!-- LEDs -->
  <circle cx="190" cy="272" r="11" fill="#22c55e"/>
  <circle cx="232" cy="272" r="11" fill="#94a3b8"/>
  <circle cx="274" cy="272" r="11" fill="#fbbf24"/>
  <circle cx="316" cy="272" r="11" fill="#94a3b8"/>
  <!-- vents -->
  <g stroke="#94a3b8" stroke-width="10" stroke-linecap="round">
    <path d="M176 318 H336"/><path d="M176 346 H336"/><path d="M176 374 H336"/>
  </g>
  <!-- local wireless badge -->
  <g>
    <circle cx="384" cy="396" r="66" fill="#2563eb" stroke="#ffffff" stroke-width="12"/>
    <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round">
      <path d="M352 392 a46 46 0 0 1 64 0"/>
      <path d="M365 408 a26 26 0 0 1 38 0"/>
    </g>
    <circle cx="384" cy="426" r="8" fill="#fff"/>
  </g>
</svg>
